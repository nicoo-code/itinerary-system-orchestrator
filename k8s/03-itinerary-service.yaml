apiVersion: apps/v1
kind: Deployment
metadata:
  name: itinerary-service
  namespace: itinerarios-app
  labels:
    app: itinerary-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: itinerary-service
  template:
    metadata:
      labels:
        app: itinerary-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: itinerary-service
          image: itinerarios/itinerary-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
          envFrom:
            - configMapRef:
                name: itinerarios-config
            - secretRef:
                name: itinerarios-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: itinerary-service
  namespace: itinerarios-app
  labels:
    app: itinerary-service
spec:
  type: ClusterIP
  selector:
    app: itinerary-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
