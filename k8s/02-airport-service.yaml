apiVersion: apps/v1
kind: Deployment
metadata:
  name: airport-service
  namespace: itinerarios-app
  labels:
    app: airport-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airport-service
  template:
    metadata:
      labels:
        app: airport-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: airport-service
          image: itinerarios/airport-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
          envFrom:
            - configMapRef:
                name: itinerarios-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: airport-service
  namespace: itinerarios-app
  labels:
    app: airport-service
spec:
  type: ClusterIP
  selector:
    app: airport-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
