groups:
  - name: itinerarios_platform_alerts
    rules:
      - alert: AirportCircuitBreakerOpen
        expr: airport_circuit_breaker_state == 2
        for: 30s
        labels:
          severity: critical
          service: airport-service
        annotations:
          summary: "Circuit Breaker abierto en Airport Service"
          description: "El Circuit Breaker hacia API Colombia está en estado OPEN (valor 2) durante más de 30 segundos."

      - alert: HighHttp5xxErrorRate
        expr: (sum(rate(http_requests_total{status_code=~"5.."}[2m])) by (service) / sum(rate(http_requests_total[2m])) by (service)) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores HTTP 5xx (>5%) en {{ $labels.service }}"
          description: "El servicio {{ $labels.service }} presenta una tasa de respuestas HTTP 5xx superior al 5% en los últimos 2 minutos."

      - alert: MicroserviceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Microservicio {{ $labels.job }} fuera de línea"
          description: "El objetivo {{ $labels.instance }} del job {{ $labels.job }} no responde al scrape de Prometheus durante más de 1 minuto."
