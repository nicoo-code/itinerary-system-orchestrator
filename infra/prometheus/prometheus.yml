global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "airport-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["airport-service:8001"]

  - job_name: "itinerary-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["itinerary-service:8002"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification-service:8003"]
